on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: go-task/setup-task@v1
        with:
          version: "3.50"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: rustup default 1.97.0
      - run: task check

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: go-task/setup-task@v1
        with:
          version: "3.50"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: rustup default 1.97.0
      - run: task build test
