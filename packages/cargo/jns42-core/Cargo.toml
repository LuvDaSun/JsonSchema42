[package]
name = "jns42-core"
version = "0.1.3"
edition = "2024"
description = "Core of jns42"
license = "ISC"
authors = ["Elmer Bulthuis"]
homepage = "https://www.JsonSchema42.org"
keywords = ["json", "schema"]
repository = "https://github.com/LuvDaSun/JsonSchema42"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
im = "^15.1.0"
url = "^2.5.8"
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.151"
serde_yaml = "^0.9.34"
once_cell = "^1.21.4"
quote = "^1.0.47"
regex = "^1.13.1"
urlencoding = "^2.1.3"
itertools = "^0.15.0"
semver = "^1.0.28"
wit-bindgen = "^0.60.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }

[lib]
crate-type = ["rlib", "cdylib"]
