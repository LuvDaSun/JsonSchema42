version: "3"

tasks:
  install:
    desc: Install everything
    cmds:
      - task: install:node
      - task: install:cargo-targets

  build:
    run: once
    cmds:
      - task: build:tsc
      - task: build:rollup
      - task: build:cargo

  check:
    desc: Check everything
    cmds:
      - task: check:formatting
      - task: check:spelling
      - task: check:audit
      - task: check:cargo

  fix:
    desc: Fix everything
    cmds:
      - task: fix:formatting
      - task: fix:cargo

  install:node:
    run: once
    desc: Install Node.js dependencies
    cmds:
      - npm clean-install

  install:cargo-targets:
    run: once
    cmds:
      - rustup target add wasm32-unknown-unknown

  build:tsc:
    run: once
    deps:
      - install:node
      - build:cargo
    cmds:
      - npm run tsc

  build:rollup:
    run: once
    deps:
      - build:tsc
      - install:node
    cmds:
      - npm run rollup

  build:cargo:
    run: once
    deps:
      - install:cargo-targets
    cmds:
      - cargo build --release
      - cargo build --package jns42-core --target wasm32-unknown-unknown --release
      - wasm-bindgen --target nodejs --out-dir packages/npm/jns42-core/dist target/wasm32-unknown-unknown/release/jns42_core.wasm

  check:formatting:
    desc: Check formatting
    deps:
      - install:node
    cmds:
      - npm run formatting

  check:spelling:
    desc: Check spelling
    deps:
      - install:node
    cmds:
      - npm run spelling

  check:audit:
    desc: Audit
    cmds:
      - npm audit

  check:cargo:
    cmds:
      - cargo check

  fix:formatting:
    desc: Fix formatting
    deps:
      - install:node
    cmds:
      - npm run fix-formatting

  fix:cargo:
    cmds:
      - cargo fix --allow-dirty
