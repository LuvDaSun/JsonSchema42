version: "3"

tasks:
  install:
    desc: Install everything
    cmds:
      - task: install:node

  build:
    run: once
    cmds:
      - task: build:tsc
      - task: build:rollup

  check:
    desc: Check everything
    cmds:
      - task: check:formatting
      - task: check:spelling
      - task: check:audit

  fix:
    desc: Fix everything
    cmds:
      - task: fix:formatting

  install:node:
    run: once
    desc: Install Node.js dependencies
    cmds:
      - npm clean-install

  build:tsc:
    run: once
    deps:
      - install:node
    cmds:
      - npm run tsc

  build:rollup:
    run: once
    deps:
      - build:tsc
      - install:node
    cmds:
      - npm run rollup

  check:formatting:
    desc: Check formatting
    deps:
      - install:node
    cmds:
      - npm run formatting

  check:spelling:
    desc: Check spelling
    deps:
      - install:node
    cmds:
      - npm run spelling

  check:audit:
    desc: Audit
    cmds:
      - npm audit

  fix:formatting:
    desc: Fix formatting
    deps:
      - install:node
    cmds:
      - npm run fix-formatting
